<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Settlr — Welcome!</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../tokens/index.css">
  <link rel="stylesheet" href="../css/index.css">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-body);
      background: var(--surface-primary);
      color: var(--text-primary);
      max-width: 393px;
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Status Bar ── */
    .status-bar {
      height: 44px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--spacing-24);
    }
    .status-bar__time {
      font-family: var(--font-body);
      font-size: var(--font-size-14);
      font-weight: var(--weight-semibold);
      line-height: var(--line-height-20);
      letter-spacing: -0.5px;
      color: var(--text-primary);
    }
    .status-bar__icons {
      display: flex;
      align-items: center;
      gap: var(--spacing-4);
      color: var(--text-primary);
    }

    /* ── Welcome layout ── */
    .welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: var(--spacing-32) var(--spacing-24) var(--spacing-16);
      gap: var(--spacing-24);
    }

    .welcome__hero {
      width: 96px;
      height: 96px;
      border-radius: var(--radius-full);
      background: var(--btn-secondary-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: bounceIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both;
    }
    .welcome__hero-emoji {
      font-size: 48px;
      line-height: 1;
      animation: wiggle 0.6s ease 0.8s both;
    }

    .welcome__eyebrow {
      animation: fadeUp 0.5s ease 0.4s both;
      color: var(--text-brand);
    }

    .welcome__title {
      animation: fadeUp 0.5s ease 0.5s both;
      color: var(--top-app-bar-title);
    }
    .welcome__title-brand {
      color: var(--text-brand);
    }

    .welcome__body {
      animation: fadeUp 0.5s ease 0.6s both;
      color: var(--text-secondary);
      max-width: 320px;
    }

    .welcome__divider {
      height: var(--border-small);
      background: var(--border-subtle);
      margin: var(--spacing-8) 0;
      animation: fadeUp 0.5s ease 0.7s both;
    }

    .welcome__features {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-16);
      animation: fadeUp 0.5s ease 0.8s both;
    }
    .welcome__feature {
      display: flex;
      align-items: center;
      gap: var(--spacing-12);
    }
    .welcome__feature-bullet {
      width: var(--spacing-8);
      height: var(--spacing-8);
      border-radius: var(--radius-full);
      background: var(--text-brand);
      flex-shrink: 0;
    }
    .welcome__feature-text {
      color: var(--text-primary);
    }

    @keyframes bounceIn {
      from { transform: scale(0); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    @keyframes wiggle {
      0% { transform: rotate(0deg); }
      25% { transform: rotate(-12deg); }
      50% { transform: rotate(12deg); }
      75% { transform: rotate(-6deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .welcome__hero, .welcome__eyebrow, .welcome__title,
      .welcome__body, .welcome__divider, .welcome__features {
        animation: none;
      }
    }
  </style>
  <script src="../js/router.js"></script>
</head>
<body>

  <!-- ── Status Bar ── -->
  <div class="status-bar">
    <span class="status-bar__time">9:41</span>
    <div class="status-bar__icons">
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><rect x="0" y="4" width="3" height="8" rx="1" fill="currentColor"/><rect x="4.5" y="2.5" width="3" height="9.5" rx="1" fill="currentColor"/><rect x="9" y="1" width="3" height="11" rx="1" fill="currentColor"/><rect x="13.5" y="0" width="3" height="12" rx="1" fill="currentColor" opacity="0.35"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 9.5a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5z" fill="currentColor"/><path d="M3.5 6.2C4.9 4.8 6.9 4 9 4s4.1.8 5.5 2.2l-1.5 1.5C11.9 6.6 10.5 6 9 6S6.1 6.6 5 7.7L3.5 6.2z" fill="currentColor"/><path d="M.5 3.2C2.4 1.2 5.6 0 9 0s6.6 1.2 8.5 3.2L16 4.7C14.5 3 11.9 2 9 2S3.5 3 2 4.7L.5 3.2z" fill="currentColor"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="currentColor" stroke-opacity="0.35"/><rect x="2" y="2" width="18" height="8" rx="2" fill="currentColor"/><path d="M23 4v4a2 2 0 0 0 0-4z" fill="currentColor" fill-opacity="0.4"/></svg>
    </div>
  </div>

  <!-- ── Welcome content ── -->
  <div class="welcome">

    <div class="welcome__hero">
      <span class="welcome__hero-emoji">🎉</span>
    </div>

    <div class="welcome__eyebrow text-overline-md">You're all set</div>

    <h1 class="welcome__title text-display-lg">
      Welcome to<br><span class="welcome__title-brand">Settlr</span>
    </h1>

    <p class="welcome__body text-body-md">
      Less math. More memories.
    </p>

    <div class="welcome__divider"></div>

    <div class="welcome__features">
      <div class="welcome__feature">
        <span class="welcome__feature-bullet"></span>
        <span class="welcome__feature-text text-title-sm">Create groups in seconds</span>
      </div>
      <div class="welcome__feature">
        <span class="welcome__feature-bullet"></span>
        <span class="welcome__feature-text text-title-sm">Split equally, by amount, or by share</span>
      </div>
      <div class="welcome__feature">
        <span class="welcome__feature-bullet"></span>
        <span class="welcome__feature-text text-title-sm">Settle up in a single tap</span>
      </div>
    </div>

  </div>

  <!-- ── Bottom CTA ── -->
  <div class="screen-footer">
    <a href="home-dashboard" class="btn btn--primary btn--lg btn--full">Let's Go!</a>
  </div>

<script src="../js/list-stagger.js" defer></script>
<script src="../js/sheet-drag.js" defer></script>
<script src="../js/swipe-back.js" defer></script>
<script src="../js/pull-refresh.js" defer></script>
</body>
</html>
