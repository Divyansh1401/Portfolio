<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Settlr — Edit Expense</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/index.css">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-body);
      background: var(--surface-primary);
      color: var(--text-primary);
      max-width: 393px;
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Scrollable Content ── */
    .scroll-content {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: var(--spacing-8) var(--spacing-24) calc(var(--spacing-96) + var(--spacing-24));
      display: flex;
      flex-direction: column;
      gap: var(--spacing-24);
    }

    /* ── Amount Display (editable) — screen-unique ── */
    .amount-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--spacing-8);
      padding: var(--spacing-16) 0;
    }
    .amount-input-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--spacing-4);
      width: 100%;
    }
    .amount-input-wrap__symbol {
      font-family: var(--font-display);
      font-size: 36px;
      font-weight: var(--weight-bold);
      letter-spacing: -1.44px;
      color: var(--text-primary);
    }
    .amount-input-wrap input {
      border: none;
      outline: none;
      background: transparent;
      font-family: var(--font-display);
      font-size: 36px;
      font-weight: var(--weight-bold);
      letter-spacing: -1.44px;
      color: var(--text-primary);
      text-align: center;
      width: 180px;
      caret-color: var(--text-brand);
    }

    /* ── Category Chips (screen-unique horizontal scroller) ── */
    .chips-section {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-8);
    }
    .chips-row {
      display: flex;
      gap: var(--spacing-8);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .chips-row::-webkit-scrollbar { display: none; }

  </style>
</head>
<body>

  <!-- ── Status Bar ── -->
  <div class="status-bar">
    <span class="status-bar__time">9:41</span>
    <div class="status-bar__icons">
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><rect x="0" y="4" width="3" height="8" rx="1" fill="currentColor"/><rect x="4.5" y="2.5" width="3" height="9.5" rx="1" fill="currentColor"/><rect x="9" y="1" width="3" height="11" rx="1" fill="currentColor"/><rect x="13.5" y="0" width="3" height="12" rx="1" fill="currentColor" opacity="0.35"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 9.5a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5z" fill="currentColor"/><path d="M3.5 6.2C4.9 4.8 6.9 4 9 4s4.1.8 5.5 2.2l-1.5 1.5C11.9 6.6 10.5 6 9 6S6.1 6.6 5 7.7L3.5 6.2z" fill="currentColor"/><path d="M.5 3.2C2.4 1.2 5.6 0 9 0s6.6 1.2 8.5 3.2L16 4.7C14.5 3 11.9 2 9 2S3.5 3 2 4.7L.5 3.2z" fill="currentColor"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="currentColor" stroke-opacity="0.35"/><rect x="2" y="2" width="18" height="8" rx="2" fill="currentColor"/><path d="M23 4v4a2 2 0 0 0 0-4z" fill="currentColor" fill-opacity="0.4"/></svg>
    </div>
  </div>

  <!-- ── Top Bar ── -->
  <header class="top-app-bar top-app-bar--nav">
    <a href="expense-detail.html" class="top-app-bar__back" aria-label="Back">
      <i class="ph-bold ph-caret-left"></i>
    </a>
    <span class="top-app-bar__title">Edit Expense</span>
  </header>

  <!-- ── Scrollable Content ── -->
  <div class="scroll-content">

    <!-- Amount -->
    <div class="amount-area">
      <button class="currency-chip">
        ₹ INR
        <i class="ph ph-caret-down currency-chip__caret"></i>
      </button>
      <div class="amount-input-wrap">
        <span class="amount-input-wrap__symbol">₹</span>
        <input type="text" inputmode="decimal" value="850">
      </div>
    </div>

    <!-- Description -->
    <div class="input-field">
      <label class="input-field__label">Description</label>
      <div class="input-field__box">
        <input type="text" value="Dinner at Olive">
      </div>
    </div>

    <!-- Category -->
    <div class="chips-section">
      <span class="input-field__label">Category</span>
      <div class="chips-row">
        <span class="chip chip--md chip--on" onclick="selectCat(this)">🍽 Food</span>
        <span class="chip chip--md" onclick="selectCat(this)">✈️ Travel</span>
        <span class="chip chip--md" onclick="selectCat(this)">🛍 Shopping</span>
        <span class="chip chip--md" onclick="selectCat(this)">📄 Bills</span>
        <span class="chip chip--md" onclick="selectCat(this)">📦 Other</span>
      </div>
    </div>

    <!-- Paid by -->
    <div class="detail-row detail-row--clickable">
      <div class="detail-row__icon">💳</div>
      <div class="detail-row__text">
        <span class="detail-row__label">Paid by</span>
        <span class="detail-row__value">You paid ₹850</span>
      </div>
      <i class="ph ph-caret-right detail-row__chevron"></i>
    </div>

    <!-- Group -->
    <div class="detail-row detail-row--clickable">
      <div class="detail-row__icon">🏝</div>
      <div class="detail-row__text">
        <span class="detail-row__label">Group</span>
        <span class="detail-row__value">Goa Trip</span>
      </div>
      <i class="ph ph-caret-right detail-row__chevron"></i>
    </div>

    <!-- Date -->
    <div class="detail-row detail-row--clickable">
      <div class="detail-row__icon">📅</div>
      <div class="detail-row__text">
        <span class="detail-row__label">Date</span>
        <span class="detail-row__value">17 March 2026</span>
      </div>
      <i class="ph ph-caret-right detail-row__chevron"></i>
    </div>

    <!-- Split -->
    <div class="detail-row detail-row--clickable">
      <div class="detail-row__icon">🔄</div>
      <div class="detail-row__text">
        <span class="detail-row__label">Split method</span>
        <span class="detail-row__value">Equal split · 4 people</span>
      </div>
      <i class="ph ph-caret-right detail-row__chevron"></i>
    </div>

    <!-- Notes -->
    <div class="notes-card notes-card--editable">
      <label class="notes-card__label" for="js-notes">Notes (optional)</label>
      <textarea id="js-notes" class="notes-card__textarea" rows="3" maxlength="280" placeholder="Add a note for this expense…">Birthday dinner for Priya. Included drinks and dessert. Everyone had a great time! 🎂</textarea>
    </div>

  </div>

  <!-- ── Screen Footer ── -->
  <div class="screen-footer">
    <a href="expense-detail.html" class="btn btn--lg btn--ghost">Discard</a>
    <a href="expense-detail.html" class="btn btn--lg btn--primary">Save Changes</a>
  </div>

  <script>
    function selectCat(el) {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('chip--on'));
      el.classList.add('chip--on');
    }
  </script>

</body>
</html>
