<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Settlr — Add Members</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/index.css">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-body);
      background: var(--surface-primary);
      color: var(--text-primary);
      max-width: 393px;
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }


    /* ── Selected Members Row (screen-unique horizontal scroller) ── */
    .selected-row {
      display: flex;
      padding: var(--spacing-4) var(--spacing-16) var(--spacing-8);
      gap: var(--spacing-8);
      overflow-x: auto;
      scrollbar-width: none;
      flex-shrink: 0;
    }
    .selected-row::-webkit-scrollbar { display: none; }

    /* ── Contact List (scroll wrapper) ── */
    .contact-list {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 120px;
    }

    /* ── Selected state on person-item ── */
    .person-item.is-selected {
      background: var(--contact-bg-selected);
    }

    /* ── Avatar circle for contact rows (40px initials) ── */
    .person-item__avatar-circle {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-full);
      background: var(--contact-avatar-bg);
      color: var(--contact-avatar-fg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-body);
      font-size: var(--font-size-14);
      font-weight: var(--weight-semibold);
      flex-shrink: 0;
    }

    /* ── Invite banner outer margin (per spec, parent applies margin) ── */
    .invite-banner-wrap {
      padding: 0 var(--spacing-16) var(--spacing-8);
    }
  </style>
  <script src="../js/router.js"></script>
</head>
<body>

  <!-- ── Status Bar ── -->
  <div class="status-bar">
    <span class="status-bar__time">9:41</span>
    <div class="status-bar__icons">
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><rect x="0" y="4" width="3" height="8" rx="1" fill="currentColor"/><rect x="4.5" y="2.5" width="3" height="9.5" rx="1" fill="currentColor"/><rect x="9" y="1" width="3" height="11" rx="1" fill="currentColor"/><rect x="13.5" y="0" width="3" height="12" rx="1" fill="currentColor" opacity="0.35"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 9.5a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5z" fill="currentColor"/><path d="M3.5 6.2C4.9 4.8 6.9 4 9 4s4.1.8 5.5 2.2l-1.5 1.5C11.9 6.6 10.5 6 9 6S6.1 6.6 5 7.7L3.5 6.2z" fill="currentColor"/><path d="M.5 3.2C2.4 1.2 5.6 0 9 0s6.6 1.2 8.5 3.2L16 4.7C14.5 3 11.9 2 9 2S3.5 3 2 4.7L.5 3.2z" fill="currentColor"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="currentColor" stroke-opacity="0.35"/><rect x="2" y="2" width="18" height="8" rx="2" fill="currentColor"/><path d="M23 4v4a2 2 0 0 0 0-4z" fill="currentColor" fill-opacity="0.4"/></svg>
    </div>
  </div>

  <!-- ── Top Bar ── -->
  <header class="top-app-bar top-app-bar--nav">
    <a href="create-group-name" class="top-app-bar__back" aria-label="Back">
      <i class="ph-bold ph-caret-left"></i>
    </a>
    <span class="top-app-bar__title">Add Members</span>
  </header>

  <!-- ── Step Progress ── -->
  <div class="step-progress">
    <div class="step-progress__step step-progress__step--active"></div>
    <div class="step-progress__step step-progress__step--active"></div>
    <div class="step-progress__step"></div>
  </div>

  <!-- ── Search ── -->
  <div class="search-wrap">
    <div class="search-input">
      <span class="search-input__icon"><i class="ph ph-magnifying-glass"></i></span>
      <input type="text" placeholder="Search contacts...">
    </div>
  </div>

  <!-- ── Selected Members ── -->
  <div class="selected-row" id="js-chips"></div>

  <!-- ── Invite by Link ── -->
  <div class="invite-banner-wrap">
    <a href="add-friend" class="invite-banner">
      <div class="invite-banner__icon">
        <i class="ph ph-plus"></i>
      </div>
      <div class="invite-banner__text">
        <div class="invite-banner__title">Invite via link</div>
        <div class="invite-banner__subtitle">Share a join link with friends</div>
      </div>
    </a>
  </div>

  <!-- ── Contact List (rendered by JS) ── -->
  <div class="contact-list" id="js-contact-list"></div>

  <!-- ── Bottom CTA ── -->
  <div class="screen-footer">
    <button id="js-create" class="btn btn--primary btn--lg btn--full" style="opacity:0.4;pointer-events:none;">Create Group</button>
  </div>

  <script src="../js/store.js"></script>
  <script>
    (function () {
      var ctx = JSON.parse(sessionStorage.getItem('settlr_new_group') || '{}');
      if (!ctx.name) { location.replace('create-group-name'); return; }

      var selectedIds = {};
      var contacts = Store.getContacts();
      var listEl = document.getElementById('js-contact-list');
      var chipsEl = document.getElementById('js-chips');
      var countEl = document.getElementById('js-count');
      var createBtn = document.getElementById('js-create');
      var searchInput = document.querySelector('.search-input input');

      function rowHTML(c) {
        return '<div class="person-item" data-id="' + c.id + '" data-name="' + c.name + '" data-initials="' + c.initials + '">' +
          '<div class="person-item__avatar-circle">' + c.initials + '</div>' +
          '<div class="person-item__text">' +
            '<span class="person-item__name">' + c.name + '</span>' +
            '<span class="person-item__subtext">' + (c.phone || '') + '</span>' +
          '</div>' +
          '<div class="checkbox-control">' +
            '<svg class="checkbox-control__check" viewBox="0 0 12 10" fill="none">' +
              '<path d="M1 5L4.5 8.5L11 1.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
            '</svg>' +
          '</div>' +
        '</div>';
      }

      function renderList(filter) {
        filter = (filter || '').toLowerCase();
        var fc = contacts.filter(function(c) { return !filter || c.name.toLowerCase().includes(filter); });
        listEl.innerHTML = '<div class="heading"><span class="heading__title">Contacts</span></div>' + fc.map(rowHTML).join('');
        listEl.querySelectorAll('.person-item').forEach(function(row) {
          var id = row.getAttribute('data-id');
          if (selectedIds[id]) {
            row.classList.add('is-selected');
            row.querySelector('.checkbox-control').classList.add('is-selected');
          }
          row.addEventListener('click', function() { toggle(id, row.getAttribute('data-name'), row.getAttribute('data-initials')); });
        });
      }

      function toggle(id, name, initials) {
        if (selectedIds[id]) {
          delete selectedIds[id];
        } else {
          selectedIds[id] = { name: name, initials: initials };
        }
        renderList(searchInput.value);
        renderChips();
        updateCount();
      }

      function renderChips() {
        var ids = Object.keys(selectedIds);
        chipsEl.innerHTML = ids.map(function(id) {
          var info = selectedIds[id];
          return '<div class="member-pill member-pill--removable" data-cid="' + id + '">' +
            '<div class="avatar avatar--xs avatar--initials">' + info.initials + '</div>' +
            '<span class="member-pill__name">' + info.name.split(' ')[0] + '</span>' +
            '<i class="ph ph-x member-pill__remove"></i>' +
          '</div>';
        }).join('');
        chipsEl.querySelectorAll('.member-pill').forEach(function(chip) {
          chip.addEventListener('click', function() {
            delete selectedIds[chip.getAttribute('data-cid')];
            renderList(searchInput.value);
            renderChips();
            updateCount();
          });
        });
      }

      function updateCount() {
        var n = Object.keys(selectedIds).length;
        if (countEl) countEl.textContent = n + ' selected';
        if (n > 0) {
          createBtn.style.opacity = '';
          createBtn.style.pointerEvents = '';
        } else {
          createBtn.style.opacity = '0.4';
          createBtn.style.pointerEvents = 'none';
        }
      }

      createBtn.addEventListener('click', function() {
        var me = Store.getCurrentUser();
        var memberIds = [me.id].concat(Object.keys(selectedIds));
        var newId = Store.addGroup({
          name: ctx.name,
          type: ctx.type || 'other',
          emoji: ctx.emoji || '📝',
          memberIds: memberIds
        });
        ctx.groupId = newId;
        ctx.memberIds = memberIds;
        sessionStorage.setItem('settlr_new_group', JSON.stringify(ctx));
        // Skip standalone "Group Created" screen — go straight to group detail
        location.href = 'group-detail?id=' + encodeURIComponent(newId);
      });

      searchInput.addEventListener('input', function() { renderList(this.value); });
      renderList();
    }());
  </script>

<script src="../js/list-stagger.js" defer></script>
<script src="../js/sheet-drag.js" defer></script>
<script src="../js/swipe-back.js" defer></script>
<script src="../js/pull-refresh.js" defer></script>
</body>
</html>
