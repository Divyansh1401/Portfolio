<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Settlr — Payment Method</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/index.css">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-body);
      background: var(--surface-primary);
      color: var(--text-primary);
      max-width: 393px;
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Content ── */
    .content {
      flex: 1;
      padding: var(--spacing-24) var(--spacing-16);
      display: flex;
      flex-direction: column;
      gap: var(--spacing-12);
    }
  </style>
</head>
<body>

  <!-- ── Status Bar ── -->
  <div class="status-bar">
    <span class="status-bar__time">9:41</span>
    <div class="status-bar__icons">
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><rect x="0" y="4" width="3" height="8" rx="1" fill="currentColor"/><rect x="4.5" y="2.5" width="3" height="9.5" rx="1" fill="currentColor"/><rect x="9" y="1" width="3" height="11" rx="1" fill="currentColor"/><rect x="13.5" y="0" width="3" height="12" rx="1" fill="currentColor" opacity="0.35"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 9.5a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5z" fill="currentColor"/><path d="M3.5 6.2C4.9 4.8 6.9 4 9 4s4.1.8 5.5 2.2l-1.5 1.5C11.9 6.6 10.5 6 9 6S6.1 6.6 5 7.7L3.5 6.2z" fill="currentColor"/><path d="M.5 3.2C2.4 1.2 5.6 0 9 0s6.6 1.2 8.5 3.2L16 4.7C14.5 3 11.9 2 9 2S3.5 3 2 4.7L.5 3.2z" fill="currentColor"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="currentColor" stroke-opacity="0.35"/><rect x="2" y="2" width="18" height="8" rx="2" fill="currentColor"/><path d="M23 4v4a2 2 0 0 0 0-4z" fill="currentColor" fill-opacity="0.4"/></svg>
    </div>
  </div>

  <!-- ── Top Bar ── -->
  <header class="top-app-bar top-app-bar--nav">
    <a href="settle-amount" class="top-app-bar__back" aria-label="Back">
      <i class="ph-bold ph-caret-left"></i>
    </a>
    <span class="top-app-bar__title">Settle Up</span>
  </header>

  <!-- ── Step Progress ── -->
  <div class="step-progress">
    <div class="step-progress__step step-progress__step--active"></div>
    <div class="step-progress__step step-progress__step--active"></div>
    <div class="step-progress__step step-progress__step--active"></div>
  </div>

  <!-- ── Summary Card ── -->
  <div class="summary-card" id="js-summary">
    <div class="summary-card__avatar" id="js-avatar">JW</div>
    <div class="summary-card__name" id="js-name">Johnnie Walker</div>
    <div class="summary-card__amount summary-card__amount--owe" id="js-amount">₹1,220</div>
    <div class="summary-card__meta">Settlement amount</div>
  </div>

  <!-- ── Payment Methods ── -->
  <div class="content">
    <div class="heading"><span class="heading__text">Payment Method</span></div>

    <div class="detail-row detail-row--selectable is-selected" onclick="selectMethod(this)">
      <div class="detail-row__icon">💳</div>
      <div class="detail-row__text">
        <span class="detail-row__value">UPI</span>
        <span class="detail-row__label">Pay via UPI apps</span>
      </div>
      <div class="detail-row__radio">
        <div class="detail-row__radio-dot"></div>
      </div>
    </div>

    <div class="detail-row detail-row--selectable" onclick="selectMethod(this)">
      <div class="detail-row__icon">💵</div>
      <div class="detail-row__text">
        <span class="detail-row__value">Cash</span>
        <span class="detail-row__label">Paid in cash</span>
      </div>
      <div class="detail-row__radio">
        <div class="detail-row__radio-dot"></div>
      </div>
    </div>

    <div class="detail-row detail-row--selectable" onclick="selectMethod(this)">
      <div class="detail-row__icon">🏦</div>
      <div class="detail-row__text">
        <span class="detail-row__value">Bank Transfer</span>
        <span class="detail-row__label">Direct bank transfer</span>
      </div>
      <div class="detail-row__radio">
        <div class="detail-row__radio-dot"></div>
      </div>
    </div>

    <div class="detail-row detail-row--selectable" onclick="selectMethod(this)">
      <div class="detail-row__icon">📝</div>
      <div class="detail-row__text">
        <span class="detail-row__value">Other</span>
        <span class="detail-row__label">Record as settled</span>
      </div>
      <div class="detail-row__radio">
        <div class="detail-row__radio-dot"></div>
      </div>
    </div>
  </div>

  <!-- ── Bottom CTA ── -->
  <div class="screen-footer">
    <button class="btn btn--lg btn--primary" id="js-confirm">Confirm Settlement</button>
  </div>

  <script>
    function selectMethod(el) {
      document.querySelectorAll('.detail-row--selectable').forEach(function(m) { m.classList.remove('is-selected'); });
      el.classList.add('is-selected');
    }

    (function () {
      var state = JSON.parse(sessionStorage.getItem('settlr_settle') || '{}');
      if (state.contactInitials) document.getElementById('js-avatar').textContent = state.contactInitials;
      if (state.contactName)    document.getElementById('js-name').textContent = state.contactName;
      if (state.amount) {
        var formatted = '₹' + new Intl.NumberFormat('en-IN').format(Math.round(state.amount * 100) / 100);
        var amountEl = document.getElementById('js-amount');
        amountEl.textContent = formatted;
        amountEl.classList.remove('summary-card__amount--owe', 'summary-card__amount--lent');
        amountEl.classList.add(state.direction === 'lent' ? 'summary-card__amount--lent' : 'summary-card__amount--owe');
      }

      document.getElementById('js-confirm').addEventListener('click', function() {
        var selected = document.querySelector('.detail-row--selectable.is-selected .detail-row__value');
        var method = selected ? selected.textContent : 'Other';
        state.method = method;
        sessionStorage.setItem('settlr_settle', JSON.stringify(state));
        location.href = 'settle-success';
      });
    }());
  </script>

</body>
</html>
