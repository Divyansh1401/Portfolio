<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Settlr — Component Playground</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../tokens/index.css">
  <link rel="stylesheet" href="../css/index.css">
  <script src="../js/components.js"></script>
  <script src="../js/icons.js"></script>
  <script src="../js/icons-fill.js"></script>
  <script src="../js/icon-upgrade.js"></script>
  <script src="../js/bottom-nav-slider.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--font-body);
      background: var(--surface-primary);
      color: var(--text-primary);
    }

    /* ── Shell ──────────────────────────────────────────── */
    .pg-shell { display: grid; grid-template-columns: 248px 1fr; height: 100vh; }

    /* ── Sidebar (dark, grouped — Kinko style) ──────────── */
    .pg-sidebar {
      background: var(--color-neutral-900);
      color: var(--text-inverse);
      padding: var(--spacing-16);
      display: flex;
      flex-direction: column;
      gap: var(--spacing-12);
      overflow: auto;
    }
    .pg-sidebar__title { margin: 0; font-family: var(--font-display); font-size: var(--font-size-18); font-weight: var(--weight-bold); }
    .pg-sidebar__subtitle { margin: 0; font-size: var(--font-size-12); color: var(--color-neutral-400); }
    .pg-search {
      margin-top: var(--spacing-8);
      width: 100%;
      background: var(--color-neutral-800);
      border: var(--border-small) solid var(--color-neutral-700);
      color: var(--text-inverse);
      border-radius: var(--radius-8);
      padding: var(--spacing-8) var(--spacing-12);
      font-family: var(--font-body);
      font-size: var(--font-size-13);
    }
    .pg-search::placeholder { color: var(--color-neutral-500); }
    .pg-nav { display: flex; flex-direction: column; gap: var(--spacing-12); margin-top: var(--spacing-4); }
    .pg-group { display: flex; flex-direction: column; gap: 2px; }
    .pg-group__title {
      font-size: var(--font-size-12);
      font-weight: var(--weight-bold);
      color: var(--color-neutral-500);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      padding: var(--spacing-4) var(--spacing-12) 2px;
    }
    .pg-nav__item {
      appearance: none;
      background: transparent;
      border: 0;
      color: var(--color-neutral-300);
      text-align: left;
      padding: var(--spacing-8) var(--spacing-12);
      font-family: var(--font-body);
      font-size: var(--font-size-13);
      font-weight: var(--weight-semibold);
      border-radius: var(--radius-8);
      cursor: pointer;
      transition: var(--transition-tap, background .12s ease, color .12s ease);
    }
    .pg-nav__item:hover { color: var(--text-inverse); background: var(--color-neutral-800); }
    .pg-nav__item.is-active { background: var(--color-olive-600); color: var(--text-inverse); }

    /* ── Main pane ──────────────────────────────────────── */
    .pg-main { overflow: auto; display: flex; flex-direction: column; }
    .pg-header {
      padding: var(--spacing-24) var(--spacing-32) var(--spacing-16);
      border-bottom: var(--border-small) solid var(--border-subtle);
      position: sticky; top: 0; background: var(--surface-primary); z-index: 2;
    }
    .pg-header__name { margin: 0; font-family: var(--font-display); font-size: var(--font-size-24); font-weight: var(--weight-bold); }
    .pg-header__blurb { margin: var(--spacing-4) 0 0; color: var(--text-secondary); font-size: var(--font-size-14); }
    .pg-header__tag { margin: var(--spacing-8) 0 0; font-size: var(--font-size-12); color: var(--text-tertiary); }
    .pg-header__tag code { font-family: ui-monospace, Menlo, monospace; color: var(--text-brand); }

    .pg-body { display: grid; grid-template-columns: 1fr 300px; gap: var(--spacing-24); padding: var(--spacing-24) var(--spacing-32) var(--spacing-64); align-items: start; }

    /* Left column: preview + code stacked */
    .pg-left { display: flex; flex-direction: column; gap: var(--spacing-16); min-width: 0; }

    .pg-panel {
      background: var(--surface-card);
      border: var(--border-small) solid var(--border-subtle);
      border-radius: var(--radius-16);
      overflow: hidden;
    }
    .pg-panel__head {
      display: flex; align-items: center; justify-content: space-between;
      padding: var(--spacing-12) var(--spacing-16);
      border-bottom: var(--border-small) solid var(--border-subtle);
    }
    .pg-panel__title { font-size: var(--font-size-12); font-weight: var(--weight-bold); text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-tertiary); }
    .pg-hint { font-weight: var(--weight-medium); text-transform: none; letter-spacing: 0; color: var(--text-placeholder); }

    /* Device frame — 360 × 360 viewport so components show at true size */
    .pg-preview { padding: var(--spacing-24); display: flex; justify-content: center; background: var(--surface-input); }
    .pg-stage {
      width: 360px; max-width: 100%;
      background: var(--surface-primary);
      border-radius: var(--radius-24, 24px);
      border: var(--border-small) solid var(--border-default);
      box-shadow: var(--shadow-md, 0 8px 24px rgba(14,6,24,0.12));
      overflow-y: auto;
      position: relative;
      display: flex; flex-direction: column;
    }
    /* Device mode locks to a 360 × 360 viewport */
    .pg-preview--device .pg-stage { height: 360px; }
    .pg-stage--center { align-items: center; justify-content: center; padding: var(--spacing-24); gap: var(--spacing-12); }
    .pg-stage--pad { padding: var(--spacing-16); gap: var(--spacing-12); }
    /* Edge-anchored chrome — fills width, pinned to its real screen position */
    .pg-stage--top { align-items: stretch; justify-content: flex-start; }
    .pg-stage--bottom { align-items: stretch; justify-content: flex-end; }
    .pg-stage--fill { align-items: stretch; justify-content: stretch; padding: 0; }
    .pg-stage--fill .sheet-overlay { height: 100% !important; min-height: 100% !important; align-items: flex-end !important; }

    /* Neutralise fixed positioning so chrome renders inline in the stage */
    .pg-stage settlr-status-bar,
    .pg-stage .screen-footer,
    .pg-stage .action-btn-row,
    .pg-stage .sheet-overlay,
    .pg-stage .bottom-nav-bar {
      position: static !important;
      transform: none !important;
      left: auto !important; right: auto !important; bottom: auto !important;
      top: auto !important;
      width: 100% !important;
    }
    .pg-stage .sheet-overlay { min-height: 0 !important; inset: auto !important; }

    /* Toggle: device vs free canvas */
    .pg-seg { display: inline-flex; border: var(--border-small) solid var(--border-subtle); border-radius: var(--radius-8); overflow: hidden; }
    .pg-seg button {
      appearance: none; background: var(--surface-card); border: 0; cursor: pointer;
      padding: var(--spacing-4) var(--spacing-12);
      font-family: var(--font-body); font-size: var(--font-size-12); font-weight: var(--weight-semibold);
      color: var(--text-secondary);
    }
    .pg-seg button.is-active { background: var(--color-neutral-900); color: var(--text-inverse); }

    .pg-preview--free .pg-stage { width: 100%; border-style: dashed; box-shadow: none; }

    /* States & Variants matrix */
    .pg-states { display: flex; flex-direction: column; gap: var(--spacing-12); padding: var(--spacing-16); }
    .pg-states__subhead { font-size: var(--font-size-12); font-weight: var(--weight-bold); color: var(--text-brand); text-transform: uppercase; letter-spacing: 0.6px; margin-top: var(--spacing-4); }
    .pg-states__subhead:first-child { margin-top: 0; }
    .pg-state-cell { display: flex; align-items: center; gap: var(--spacing-16); }
    .pg-state-cell__label { width: 96px; flex-shrink: 0; font-size: var(--font-size-12); font-weight: var(--weight-semibold); color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.5px; }
    .pg-state-cell__box { flex: 1; min-width: 0; background: var(--surface-input); border-radius: var(--radius-8); padding: var(--spacing-12); display: flex; align-items: center; justify-content: flex-start; min-height: var(--spacing-48); }

    /* Code view */
    .pg-code { display: flex; flex-direction: column; }
    .pg-source__path { margin-right: auto; margin-left: var(--spacing-8); font-family: ui-monospace, Menlo, monospace; font-size: var(--font-size-12); color: var(--text-tertiary); }
    .pg-code pre.pg-source { max-height: 360px; }
    .pg-code pre {
      margin: 0; padding: var(--spacing-16);
      background: var(--color-neutral-900);
      color: var(--color-neutral-100);
      font-family: ui-monospace, Menlo, monospace;
      font-size: var(--font-size-12);
      line-height: var(--line-height-20, 1.6);
      overflow: auto;
      white-space: pre;
    }
    .pg-code .tok-tag { color: var(--color-olive-200); }
    .pg-code .tok-attr { color: var(--color-neutral-400); }
    .pg-code .tok-str { color: var(--color-olive-100); }
    .pg-copy {
      appearance: none; cursor: pointer;
      background: var(--surface-card); border: var(--border-small) solid var(--border-subtle);
      border-radius: var(--radius-full); padding: var(--spacing-4) var(--spacing-12);
      font-family: var(--font-body); font-size: var(--font-size-12); font-weight: var(--weight-semibold);
      color: var(--text-secondary);
    }
    .pg-copy:active { transform: scale(var(--press-scale, 0.97)); }

    /* Right column: controls */
    .pg-controls { position: sticky; top: 96px; }
    .pg-controls__title { margin: 0 0 var(--spacing-12); font-size: var(--font-size-14); font-weight: var(--weight-bold); }
    .pg-field { display: flex; flex-direction: column; gap: var(--spacing-4); margin-bottom: var(--spacing-12); }
    .pg-field__label { font-size: var(--font-size-12); font-weight: var(--weight-semibold); color: var(--text-secondary); }
    .pg-field select,
    .pg-field input[type="text"] {
      appearance: none;
      width: 100%;
      font-family: var(--font-body); font-size: var(--font-size-13);
      padding: var(--spacing-8) var(--spacing-12);
      border: var(--border-small) solid var(--border-subtle);
      border-radius: var(--radius-8);
      background: var(--surface-card); color: var(--text-primary);
    }
    .pg-field--inline { flex-direction: row; align-items: center; justify-content: space-between; }
    .pg-segctl { display: flex; flex-wrap: wrap; gap: var(--spacing-4); border: var(--border-small) solid var(--border-subtle); border-radius: var(--radius-8); padding: 2px; }
    .pg-segctl button {
      flex: 1 1 auto; appearance: none; background: transparent; border: 0; cursor: pointer;
      padding: var(--spacing-4) var(--spacing-8); border-radius: var(--radius-8);
      font-family: var(--font-body); font-size: var(--font-size-12); font-weight: var(--weight-semibold);
      color: var(--text-secondary); text-transform: capitalize;
    }
    .pg-segctl button.is-active { background: var(--color-neutral-900); color: var(--text-inverse); }
    .pg-switch { width: 36px; height: 20px; border-radius: var(--radius-full); background: var(--surface-track); border: 0; position: relative; cursor: pointer; flex-shrink: 0; transition: background .15s ease; }
    .pg-switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: var(--radius-full); background: var(--surface-card); transition: transform .15s var(--ease-spring, ease); }
    .pg-switch.is-on { background: var(--color-olive-500); }
    .pg-switch.is-on::after { transform: translateX(16px); }
    .pg-divider { height: var(--border-small); background: var(--border-subtle); border: 0; margin: var(--spacing-16) 0; }
    .pg-spec { margin: 0; font-size: var(--font-size-12); display: grid; grid-template-columns: auto 1fr; gap: var(--spacing-4) var(--spacing-8); }
    .pg-spec dt { color: var(--text-tertiary); font-weight: var(--weight-semibold); }
    .pg-spec dd { margin: 0; color: var(--text-secondary); }

    @media (max-width: 980px) {
      /* Keep the index (sidebar) pinned on the left at all embed widths —
         only stack the inner content + controls when the pane gets narrow. */
      .pg-body { grid-template-columns: 1fr; }
      .pg-controls { position: static; }
    }
    /* True-mobile fallback only: a genuinely tiny screen still stacks the index. */
    @media (max-width: 560px) {
      .pg-shell { grid-template-columns: 1fr; }
      .pg-sidebar { height: auto; flex-direction: row; flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <div class="pg-shell">
    <aside class="pg-sidebar">
      <h1 class="pg-sidebar__title">Settlr Playground</h1>
      <p class="pg-sidebar__subtitle">Live design-system components</p>
      <input class="pg-search" id="js-pg-search" type="text" placeholder="Search components…" aria-label="Search components">
      <nav class="pg-nav" id="js-pg-nav"></nav>
    </aside>

    <main class="pg-main">
      <div class="pg-header">
        <h2 class="pg-header__name" id="js-pg-name"></h2>
        <p class="pg-header__blurb" id="js-pg-blurb"></p>
        <p class="pg-header__tag" id="js-pg-tag"></p>
      </div>

      <div class="pg-body">
        <div class="pg-left">
          <section class="pg-panel">
            <div class="pg-panel__head">
              <span class="pg-panel__title">Preview <span class="pg-hint">— click to interact</span></span>
              <div style="display:flex; align-items:center; gap: var(--spacing-8);">
                <button class="pg-copy" id="js-pg-reset" type="button">↺ Reset</button>
                <div class="pg-seg" id="js-pg-mode">
                  <button data-mode="device" class="is-active">Device</button>
                  <button data-mode="free">Canvas</button>
                </div>
              </div>
            </div>
            <div class="pg-preview pg-preview--device" id="js-pg-preview">
              <div class="pg-stage pg-stage--center" id="js-pg-stage"></div>
            </div>
          </section>

          <section class="pg-panel" id="js-pg-states-panel" hidden>
            <div class="pg-panel__head">
              <span class="pg-panel__title">States &amp; Variants</span>
            </div>
            <div class="pg-states" id="js-pg-states"></div>
          </section>

          <section class="pg-panel pg-code">
            <div class="pg-panel__head">
              <span class="pg-panel__title">Code</span>
              <button class="pg-copy" id="js-pg-copy" type="button">Copy</button>
            </div>
            <pre><code id="js-pg-codeblock"></code></pre>
          </section>

          <section class="pg-panel pg-code">
            <div class="pg-panel__head">
              <span class="pg-panel__title">Source CSS</span>
              <span class="pg-source__path" id="js-pg-source-path"></span>
              <button class="pg-copy" id="js-pg-source-copy" type="button">Copy</button>
            </div>
            <pre class="pg-source"><code id="js-pg-source"></code></pre>
          </section>
        </div>

        <aside class="pg-controls">
          <section class="pg-panel" style="padding: var(--spacing-16);">
            <h3 class="pg-controls__title">Controls</h3>
            <div id="js-pg-controls"></div>
            <hr class="pg-divider">
            <h3 class="pg-controls__title" style="font-size: var(--font-size-13);">Spec</h3>
            <dl class="pg-spec" id="js-pg-spec"></dl>
          </section>
        </aside>
      </div>
    </main>
  </div>

  <script>
  (function () {
    'use strict';

    /* ── small helpers ─────────────────────────────────── */
    var ICON_PLUS = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>';
    var ICON_USER = '<svg viewBox="0 0 14 14" fill="currentColor"><path d="M7 7a3 3 0 100-6 3 3 0 000 6zm-5 6a5 5 0 0110 0H2z"/></svg>';
    var CHECK = '<svg class="checkbox-control__check" viewBox="0 0 12 10" fill="none"><polyline points="0,5 4,9 12,1" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

    function cx() { return Array.prototype.filter.call(arguments, Boolean).join(' '); }

    /* Phosphor SVG icon map (js/icons.js) — bound inside .icon-holder.
       fill="currentColor" so they inherit color; the holder controls size. */
    var ICON_SVG = window.SETTLR_ICONS || {};
    var ICON_NAMES = Object.keys(ICON_SVG).sort();

    /* Component id → source CSS file (from code-index.json) */
    var CSS_PATHS = {
      avatar: 'css/avatar.css', avatarStack: 'css/avatar-stack.css', label: 'css/labels.css',
      iconHolder: 'css/icon-holder.css', memberPill: 'css/avatar.css', button: 'css/button.css',
      iconButton: 'css/icon-button.css', inputField: 'css/input-field.css', searchInput: 'css/search-input.css',
      chip: 'css/chip.css', toggle: 'css/toggle.css', checkbox: 'css/checkbox.css', radio: 'css/radio.css',
      segment: 'css/navigation.css', typeChip: 'css/type-chip.css', otp: 'css/otp.css',
      amountInput: 'css/amount-input.css', currencyChip: 'css/currency-chip.css',
      personItem: 'css/list-items.css', expenseItem: 'css/list-items.css', settlementItem: 'css/settlement-item.css',
      updateItem: 'css/update-item.css', detailRow: 'css/detail-row.css', settingsRow: 'css/settings-row.css',
      cardGroup: 'css/cards.css', cardCreate: 'css/cards.css', notesCard: 'css/notes-card.css',
      summaryCard: 'css/summary-card.css', heroSection: 'css/hero-section.css', inviteBanner: 'css/invite-banner.css',
      toast: 'css/toast.css', emptyState: 'css/empty-state.css', successState: 'css/success-state.css',
      faq: 'css/faq.css', topAppBar: 'css/top-app-bar.css', heading: 'css/heading.css',
      bottomNav: 'css/navigation.css', headerChips: 'css/header-chips.css', actionButtonRow: 'css/action-button-row.css',
      screenFooter: 'css/screen-footer.css', bottomSheet: 'css/bottom-sheet.css', statusBar: 'css/status-bar.css'
    };
    var cssCache = {};

    /* ── component registry ────────────────────────────── */
    var REGISTRY = [
      /* ───────── Foundations ───────── */
      {
        id: 'avatar', group: 'Foundations', label: 'Avatar',
        blurb: 'User representation — initials, photo, group (rounded square) or outline (icon placeholder).',
        tag: '<code>.avatar .avatar--{size} .avatar--{initials|photo|group|outline}</code>',
        spec: { sizes: 'xs · sm · md · lg · xl', variants: 'initials · photo · group · outline' },
        controls: [
          { type: 'segmented', key: 'size', label: 'size', options: ['xs','sm','md','lg','xl'], def: 'lg' },
          { type: 'segmented', key: 'variant', label: 'variant', options: ['initials','photo','group','outline'], def: 'initials' },
          { type: 'text', key: 'initials', label: 'initials', def: 'DR' }
        ],
        render: function (s) {
          if (s.variant === 'photo') {
            return '<div class="' + cx('avatar','avatar--'+s.size,'avatar--photo') + '">' +
              '<img src="https://i.pravatar.cc/120?img=12" alt=""></div>';
          }
          if (s.variant === 'group') {
            return '<div class="' + cx('avatar','avatar--'+s.size,'avatar--initials','avatar--group') + '">🏖️</div>';
          }
          if (s.variant === 'outline') {
            return '<div class="' + cx('avatar','avatar--'+s.size,'avatar--outline') + '">' +
              '<span class="icon-holder icon-holder--md"><i class="ph ph-user"></i></span></div>';
          }
          return '<div class="' + cx('avatar','avatar--'+s.size,'avatar--initials') + '">' + s.initials + '</div>';
        }
      },
      {
        id: 'avatarStack', group: 'Foundations', label: 'Avatar Stack',
        blurb: 'Overlapping row of avatars with an optional +N overflow badge.',
        tag: '<code>.avatar-stack .avatar-stack--{size} .avatar-stack__item .avatar-stack__overflow</code>',
        spec: { sizes: 'xs · sm · md · lg' },
        controls: [
          { type: 'segmented', key: 'size', label: 'size', options: ['xs','sm','md','lg'], def: 'md' },
          { type: 'segmented', key: 'count', label: 'avatars', options: ['2','3','4'], def: '3' },
          { type: 'text', key: 'overflow', label: 'overflow (+N)', def: '+5' }
        ],
        render: function (s) {
          var names = ['RK','PS','AJ','NK'];
          var items = '';
          for (var i = 0; i < parseInt(s.count, 10); i++) items += '<div class="avatar-stack__item">' + names[i] + '</div>';
          var ovf = s.overflow ? '<div class="avatar-stack__overflow">' + s.overflow + '</div>' : '';
          return '<div class="' + cx('avatar-stack','avatar-stack--'+s.size) + '">' + items + ovf + '</div>';
        }
      },
      {
        id: 'label', group: 'Foundations', label: 'Label / Badge',
        blurb: 'Small status indicator with semantic color coding.',
        tag: '<code>.label .label--{variant} .label--{size}</code> · expense: <code>.label--expense</code>',
        spec: { sizes: 'sm · md · lg', variants: 'success · error · default · owe · lent · settled' },
        controls: [
          { type: 'select', key: 'variant', label: 'variant', options: ['success','error','default','owe','lent','settled'], def: 'success' },
          { type: 'segmented', key: 'size', label: 'size', options: ['sm','md','lg'], def: 'md' },
          { type: 'text', key: 'text', label: 'text', def: 'Success' }
        ],
        render: function (s) {
          var expense = (s.variant === 'owe' || s.variant === 'lent' || s.variant === 'settled');
          return '<span class="' + cx('label', expense ? 'label--expense' : 'label--'+s.size, 'label--'+s.variant) + '">' + s.text + '</span>';
        }
      },
      {
        id: 'iconHolder', group: 'Foundations', label: 'Icon Holder',
        blurb: 'Standard fixed-size wrapper for every Phosphor icon.',
        tag: '<code>.icon-holder .icon-holder--{size} .icon-holder--bg-brand</code> wrapping an inline SVG',
        spec: { sizes: 'xs 12 · sm 16 · md 20 · lg 24', background: 'none · brand', icons: 'inline SVG (currentColor)' },
        controls: [
          { type: 'segmented', key: 'size', label: 'size', options: ['xs','sm','md','lg'], def: 'md' },
          { type: 'select', key: 'icon', label: 'icon (SVG)', options: ICON_NAMES, def: 'heart' },
          { type: 'toggle', key: 'brand', label: 'brand background', def: false }
        ],
        render: function (s) {
          var cls = cx('icon-holder', 'icon-holder--' + s.size, s.brand && 'icon-holder--bg-brand');
          return '<span class="' + cls + '">' + (ICON_SVG[s.icon] || '') + '</span>';
        }
      },

      {
        id: 'memberPill', group: 'Foundations', label: 'Member Pill',
        blurb: 'Compact pill with avatar and name, optionally removable.',
        tag: '<code>.member-pill .member-pill__name .member-pill__remove</code>',
        spec: { variants: 'default · removable' },
        controls: [

          { type: 'segmented', key: 'total', label: 'steps', options: ['2','3','4'], def: '3' },
          { type: 'segmented', key: 'active', label: 'active', options: ['0','1','2','3'], def: '0' }
        ],
        render: function (s) {
          var total = parseInt(s.total, 10), idx = parseInt(s.active, 10), steps = '';
          for (var i = 0; i < total; i++) {
            steps += '<div class="' + cx('step-progress__step', i === idx && 'step-progress__step--active') + '"></div>';
          }
          return '<div class="step-progress" style="width:100%">' + steps + '</div>';
        }
      },
      {
        id: 'actionButtonRow', group: 'Navigation', label: 'Action Button Row', stage: 'bottom',
        blurb: 'Fixed bottom row with one or two full-width action buttons (legacy — prefer screen footer).',
        tag: '<code>.action-btn-row</code> wrapping <code>.btn.btn--lg</code>',
        spec: {},
        controls: [
          { type: 'segmented', key: 'buttons', label: 'buttons', options: ['one','two'], def: 'two' }
        ],
        render: function (s) {
          var primary = '<button class="btn btn--lg btn--primary"><span class="btn__content">Settle Up</span></button>';
          if (s.buttons === 'one') return '<div class="action-btn-row">' + primary + '</div>';
          return '<div class="action-btn-row"><button class="btn btn--lg btn--secondary"><span class="btn__content">Add Expense</span></button>' + primary + '</div>';
        }
      },
      {
        id: 'screenFooter', group: 'Navigation', label: 'Screen Footer', stage: 'bottom',
        blurb: 'Sticky footer with one or two action buttons; top border appears on scroll.',
        tag: '<code>.screen-footer .is-scrolled</code> wrapping <code>.btn.btn--lg</code>',
        spec: { modifiers: 'is-scrolled' },
        controls: [
          { type: 'segmented', key: 'buttons', label: 'buttons', options: ['one','two'], def: 'one' },
          { type: 'toggle', key: 'scrolled', label: 'is-scrolled', def: false }
        ],
        render: function (s) {
          var cls = cx('screen-footer', s.scrolled && 'is-scrolled');
          var primary = '<button class="btn btn--lg btn--primary btn--full"><span class="btn__content">Next <i class="btn__icon ph-bold ph-arrow-right"></i></span></button>';
          if (s.buttons === 'one') return '<div class="' + cls + '">' + primary + '</div>';
          return '<div class="' + cls + '"><a class="btn btn--lg btn--secondary"><span class="btn__content">Settle up</span></a>' +
            '<a class="btn btn--lg btn--primary"><span class="btn__content">Add expense</span></a></div>';
        }
      },

      /* ───────── Overlays ───────── */
      {
        id: 'bottomSheet', group: 'Overlays', label: 'Bottom Sheet', stage: 'fill',
        blurb: 'Modal panel sliding up from the bottom with overlay and drag handle.',
        tag: '<code>.sheet-overlay .sheet .sheet__handle .sheet__header .sheet__content</code>',
        spec: {},
        controls: [
          { type: 'text', key: 'title', label: 'title', def: 'Select category' }
        ],
        render: function (s) {
          return '<div class="sheet-overlay"><div class="sheet">' +
            '<div class="sheet__handle"><div class="sheet__handle-bar"></div></div>' +
            '<div class="sheet__header"><span class="sheet__title">' + s.title + '</span>' +
            '<button class="icon-btn icon-btn--sm" aria-label="Close"><span class="icon-holder icon-btn__icon"><i class="ph ph-x"></i></span></button></div>' +
            '<div class="sheet__content"><p style="padding:var(--spacing-16); color:var(--text-secondary)">Sheet content goes here.</p></div></div></div>';
        }
      },
      {
        id: 'statusBar', group: 'Chrome', label: 'Status Bar',
        blurb: 'iOS-style status bar showing time and system icons.',
        tag: '<code>&lt;settlr-status-bar time="9:41"&gt;</code>',
        spec: {},
        stage: 'top',
        controls: [
          { type: 'text', key: 'time', label: 'time', def: '9:41' }
        ],
        render: function (s) {
          return '<settlr-status-bar time="' + s.time + '"></settlr-status-bar>';
        }
      }
    ];

    /* ── state ─────────────────────────────────────────── */
    var current = null;     // active component def
    var values = {};        // control values for active component
    var mode = 'device';    // device | free

    /* ── build sidebar ─────────────────────────────────── */
    var navEl = document.getElementById('js-pg-nav');
    function buildNav(filter) {
      filter = (filter || '').toLowerCase();
      navEl.innerHTML = '';
      var groups = {};
      var order = [];
      REGISTRY.forEach(function (c) {
        if (filter && c.label.toLowerCase().indexOf(filter) === -1 && c.group.toLowerCase().indexOf(filter) === -1) return;
        if (!groups[c.group]) { groups[c.group] = []; order.push(c.group); }
        groups[c.group].push(c);
      });
      order.forEach(function (g) {
        var wrap = document.createElement('div');
        wrap.className = 'pg-group';
        wrap.innerHTML = '<div class="pg-group__title">' + g + '</div>';
        groups[g].forEach(function (c) {
          var btn = document.createElement('button');
          btn.className = 'pg-nav__item' + (current && current.id === c.id ? ' is-active' : '');
          btn.textContent = c.label;
          btn.setAttribute('data-id', c.id);
          btn.addEventListener('click', function () { select(c.id); });
          wrap.appendChild(btn);
        });
        navEl.appendChild(wrap);
      });
    }

    /* ── render controls ───────────────────────────────── */
    function buildControls() {
      var host = document.getElementById('js-pg-controls');
      host.innerHTML = '';
      if (!current.controls.length) {
        host.innerHTML = '<p class="pg-field__label">No props — static component.</p>';
      }
      current.controls.forEach(function (ctl) {
        var field = document.createElement('div');
        field.className = 'pg-field' + (ctl.type === 'toggle' ? ' pg-field--inline' : '');
        var label = document.createElement('span');
        label.className = 'pg-field__label';
        label.textContent = ctl.label;

        var input;
        if (ctl.type === 'select') {
          input = document.createElement('select');
          ctl.options.forEach(function (o) {
            var opt = document.createElement('option');
            opt.value = o; opt.textContent = o;
            if (values[ctl.key] === o) opt.selected = true;
            input.appendChild(opt);
          });
          input.addEventListener('change', function () { values[ctl.key] = input.value; update(); });
          field.appendChild(label); field.appendChild(input);
        } else if (ctl.type === 'text') {
          input = document.createElement('input');
          input.type = 'text'; input.value = values[ctl.key];
          input.addEventListener('input', function () { values[ctl.key] = input.value; update(); });
          field.appendChild(label); field.appendChild(input);
        } else if (ctl.type === 'segmented') {
          input = document.createElement('div');
          input.className = 'pg-segctl';
          ctl.options.forEach(function (o) {
            var b = document.createElement('button');
            b.textContent = o;
            b.className = (values[ctl.key] === o ? 'is-active' : '');
            b.addEventListener('click', function () { values[ctl.key] = o; buildControls(); update(); });
            input.appendChild(b);
          });
          field.appendChild(label); field.appendChild(input);
        } else if (ctl.type === 'toggle') {
          input = document.createElement('button');
          input.type = 'button';
          input.className = 'pg-switch' + (values[ctl.key] ? ' is-on' : '');
          input.setAttribute('aria-pressed', values[ctl.key] ? 'true' : 'false');
          input.addEventListener('click', function () { values[ctl.key] = !values[ctl.key]; buildControls(); update(); });
          field.appendChild(label); field.appendChild(input);
        }
        host.appendChild(field);
      });

      // spec
      var specEl = document.getElementById('js-pg-spec');
      specEl.innerHTML = '';
      var spec = current.spec || {};
      Object.keys(spec).forEach(function (k) {
        specEl.innerHTML += '<dt>' + k + '</dt><dd>' + spec[k] + '</dd>';
      });
    }

    /* ── pretty-print + escape code ────────────────────── */
    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function formatHtml(html) {
      // Insert newlines between adjacent tags, then indent by depth.
      var withBreaks = html.replace(/>\s*</g, '>\n<');
      var lines = withBreaks.split('\n');
      var depth = 0, out = [];
      lines.forEach(function (raw) {
        var line = raw.trim();
        if (!line) return;
        var isClose = /^<\//.test(line);
        var isSelfContained = /^<[^>]+>[^<]*<\/[^>]+>$/.test(line); // <tag>text</tag>
        var opensAndCloses = isSelfContained;
        if (isClose) depth = Math.max(0, depth - 1);
        out.push(new Array(depth + 1).join('  ') + line);
        var isVoid = /\/>$/.test(line) || /^<(input|img|br|hr|polyline|path|line|circle|rect)\b/.test(line);
        var isOpen = /^<[^/!][^>]*[^/]>$/.test(line);
        if (isOpen && !opensAndCloses && !isVoid) depth++;
      });
      return out.join('\n');
    }
    function highlight(esc) {
      // Attribute names first (before tag spans exist), then tag names.
      // Order matters: highlighting the tags first would let the attr pass
      // re-match the class="" inside the injected <span> and corrupt output.
      return esc
        .replace(/([\w-]+)="/g, '<span class="tok-attr">$1</span>="')
        .replace(/(&lt;\/?)([a-z][\w-]*)/g, '$1<span class="tok-tag">$2</span>');
    }

    /* ── update preview + code ─────────────────────────── */
    var stageEl = document.getElementById('js-pg-stage');
    var previewEl = document.getElementById('js-pg-preview');
    var codeEl = document.getElementById('js-pg-codeblock');
    var lastCode = '';

    function update() {
      var html = current.render(values);
      lastCode = formatHtml(html);
      stageEl.innerHTML = html;
      codeEl.innerHTML = highlight(escapeHtml(lastCode));
      buildStates();
      if (window.upgradeIcons) window.upgradeIcons();
      if (window.SettlrBottomNavSlider) window.SettlrBottomNavSlider.initAll();
    }

    /* Load the component's source CSS file into the Source panel */
    var sourceEl = document.getElementById('js-pg-source');
    var sourcePathEl = document.getElementById('js-pg-source-path');
    function loadSource(id) {
      var path = CSS_PATHS[id];
      if (!path) { sourcePathEl.textContent = ''; sourceEl.textContent = '/* No dedicated CSS file for this component */'; return; }
      sourcePathEl.textContent = path;
      if (cssCache[path] != null) { sourceEl.textContent = cssCache[path]; return; }
      sourceEl.textContent = 'Loading…';
      fetch('../' + path)
        .then(function (r) { return r.text(); })
        .then(function (t) { cssCache[path] = t; if (sourcePathEl.textContent === path) sourceEl.textContent = t; })
        .catch(function () { sourceEl.textContent = '/* Failed to load ' + path + ' */'; });
    }

    /* Build the state matrix — reuses render() with each state's overrides
       merged onto the live control values, so it tracks other props too. */
    var statesPanel = document.getElementById('js-pg-states-panel');
    var statesHost = document.getElementById('js-pg-states');
    function matrixCell(label, vals) {
      var cell = document.createElement('div');
      cell.className = 'pg-state-cell';
      cell.innerHTML = '<span class="pg-state-cell__label">' + label + '</span>' +
        '<div class="pg-state-cell__box">' + current.render(vals) + '</div>';
      return cell;
    }
    function matrixSubhead(text) {
      var h = document.createElement('div');
      h.className = 'pg-states__subhead';
      h.textContent = text;
      return h;
    }
    function buildStates() {
      // Variant axis = the variant/type/mode control (when it has >1 option)
      var variantCtl = current.controls.filter(function (c) {
        return c.key === 'variant' || c.key === 'type' || c.key === 'mode';
      })[0];
      var hasVariants = variantCtl && variantCtl.options && variantCtl.options.length > 1;
      var hasStates = current.states && current.states.length;
      if (!hasVariants && !hasStates) { statesPanel.hidden = true; statesHost.innerHTML = ''; return; }
      statesPanel.hidden = false;
      statesHost.innerHTML = '';
      if (hasVariants) {
        statesHost.appendChild(matrixSubhead('Variants'));
        variantCtl.options.forEach(function (opt) {
          var vals = Object.assign({}, values);
          vals[variantCtl.key] = opt;
          statesHost.appendChild(matrixCell(opt, vals));
        });
      }
      if (hasStates) {
        statesHost.appendChild(matrixSubhead('States'));
        current.states.forEach(function (st) {
          statesHost.appendChild(matrixCell(st.label, Object.assign({}, values, st.vals)));
        });
      }
    }

    function applyStageClass() {
      var place = current.stage || 'center';
      stageEl.className = 'pg-stage pg-stage--' + place;
      previewEl.className = 'pg-preview ' + (mode === 'device' ? 'pg-preview--device' : 'pg-preview--free');
    }

    /* ── select a component ────────────────────────────── */
    function select(id) {
      current = REGISTRY.filter(function (c) { return c.id === id; })[0];
      values = {};
      current.controls.forEach(function (ctl) { values[ctl.key] = ctl.def; });
      document.getElementById('js-pg-name').textContent = current.label;
      document.getElementById('js-pg-blurb').textContent = current.blurb;
      document.getElementById('js-pg-tag').innerHTML = current.tag || '';
      applyStageClass();
      buildControls();
      update();
      loadSource(current.id);
      // refresh active nav state
      Array.prototype.forEach.call(navEl.querySelectorAll('.pg-nav__item'), function (b) {
        b.classList.toggle('is-active', b.getAttribute('data-id') === id);
      });
      // sync url hash
      history.replaceState(null, '', '#' + id);
    }

    /* ── wire up chrome controls ───────────────────────── */
    document.getElementById('js-pg-mode').addEventListener('click', function (e) {
      var btn = e.target.closest('button'); if (!btn) return;
      mode = btn.getAttribute('data-mode');
      Array.prototype.forEach.call(this.querySelectorAll('button'), function (b) {
        b.classList.toggle('is-active', b === btn);
      });
      applyStageClass();
    });

    document.getElementById('js-pg-copy').addEventListener('click', function () {
      var self = this;
      navigator.clipboard.writeText(lastCode).then(function () {
        self.textContent = 'Copied!';
        setTimeout(function () { self.textContent = 'Copy'; }, 1200);
      });
    });

    document.getElementById('js-pg-source-copy').addEventListener('click', function () {
      var self = this;
      navigator.clipboard.writeText(sourceEl.textContent).then(function () {
        self.textContent = 'Copied!';
        setTimeout(function () { self.textContent = 'Copy'; }, 1200);
      });
    });

    document.getElementById('js-pg-search').addEventListener('input', function () {
      buildNav(this.value);
    });

    /* The matrix is a static reference — just swallow navigation. */
    document.getElementById('js-pg-states').addEventListener('click', function (e) {
      if (e.target.closest('a, button')) e.preventDefault();
    });

    /* The preview is LIVE: swallow navigation, then run the component's
       interaction (mutating the existing DOM in place so the real CSS
       animation plays), and sync the controls / code / matrix to match. */
    document.getElementById('js-pg-preview').addEventListener('click', function (e) {
      if (e.target.closest('a, button, label, .toggle-control, .checkbox-control, .radio-control, .segment-item, .faq-item__trigger, .detail-row')) {
        e.preventDefault();
      }
      if (interactPreview(e)) {
        buildControls();
        lastCode = formatHtml(current.render(values));
        codeEl.innerHTML = highlight(escapeHtml(lastCode));
        buildStates();
      }
    });

    /* In-place interaction per component → keeps the element alive so its
       transition/keyframe animation runs, and updates `values` so code,
       controls and the matrix stay in sync. Returns true if state changed. */
    function interactPreview(e) {
      var root = stageEl.firstElementChild;
      if (!root) return false;
      if (values.disabled) return false; // disabled components don't react
      var id = current.id;

      if (id === 'toggle') {
        values.on = !values.on;
        root.classList.toggle('is-on', values.on);
        root.setAttribute('aria-checked', values.on ? 'true' : 'false');
        return true;
      }
      if (id === 'checkbox') {
        var cb = root.classList.contains('checkbox-control') ? root : root.querySelector('.checkbox-control');
        values.selected = !values.selected;
        if (cb) cb.classList.toggle('is-selected', values.selected);
        if (root.classList.contains('checkbox-item')) root.classList.toggle('is-selected', values.selected);
        return true;
      }
      if (id === 'radio') {
        if (values.selected) return false;
        var rc = root.classList.contains('radio-control') ? root : root.querySelector('.radio-control');
        values.selected = true;
        if (rc) rc.classList.add('is-selected');
        return true;
      }
      if (id === 'chip') {
        values.active = !values.active;
        root.classList.toggle('is-active', values.active);
        return true;
      }
      if (id === 'segment') {
        var seg = e.target.closest('.segment-item'); if (!seg) return false;
        var segs = [].slice.call(root.querySelectorAll('.segment-item'));
        var si = segs.indexOf(seg); if (si < 0) return false;
        segs.forEach(function (b, i) { b.classList.toggle('is-active', i === si); });
        values.active = String(si);
        return true;
      }
      if (id === 'bottomNav') {
        var tab = e.target.closest('.bottom-nav__tab'); if (!tab) return false;
        var tabs = [].slice.call(root.querySelectorAll('.bottom-nav__tab'));
        var keys = ['home', 'people', 'activity'];
        var tabIcons = ['house', 'user', 'clock'];
        var ti = tabs.indexOf(tab); if (ti < 0) return false;
        var fill = window.SETTLR_ICONS_FILL || {}, reg = window.SETTLR_ICONS || {};
        tabs.forEach(function (t, i) {
          t.classList.toggle('is-active', i === ti);
          // Swap the upgraded SVG holder to fill (active) / regular (inactive)
          var holder = t.querySelector('.bottom-nav__tab-icon .icon-holder');
          var ic = tabIcons[i];
          if (holder && ic) holder.innerHTML = (i === ti ? fill[ic] : reg[ic]) || holder.innerHTML;
        });
        values.active = keys[ti];
        return true;
      }
      if (id === 'faq') {
        if (!e.target.closest('.faq-item__trigger')) return false;
        values.expanded = !values.expanded;
        var icon = root.querySelector('.faq-item__icon');
        if (icon) icon.textContent = values.expanded ? '−' : '+';
        var ans = root.querySelector('.faq-item__answer');
        if (values.expanded && !ans) {
          root.insertAdjacentHTML('beforeend', '<p class="faq-item__answer">Settlr helps you track shared expenses and settle up with friends.</p>');
        } else if (!values.expanded && ans) {
          ans.remove();
        }
        return true;
      }
      if (id === 'detailRow' && values.variant === 'selectable') {
        values.selected = !values.selected;
        root.classList.toggle('is-selected', values.selected);
        return true;
      }
      return false;
    }

    /* Reset → restore the component's default control values. */
    document.getElementById('js-pg-reset').addEventListener('click', function () {
      current.controls.forEach(function (ctl) { values[ctl.key] = ctl.def; });
      buildControls();
      update();
    });

    /* ── boot ──────────────────────────────────────────── */
    var initial = (location.hash || '').replace('#', '');
    var first = REGISTRY.filter(function (c) { return c.id === initial; })[0] || REGISTRY[0];
    current = first;
    buildNav('');
    select(first.id);
  })();
  </script>
</body>
</html>
