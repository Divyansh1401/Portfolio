<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bouquet Playground</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f4f1;
    --fg: #1a1a1a;
    --muted: #5a5a5a;
    --panel: #ffffff;
    --border: #d9d7d2;
    --accent: #2b6cb0;
    --focus: #2b6cb0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14151a;
      --fg: #f2f1ee;
      --muted: #a7a6a1;
      --panel: #1e2027;
      --border: #34363f;
      --accent: #7db4f0;
      --focus: #7db4f0;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    overflow-x: hidden;
    max-width: 100%;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  :focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }
  .hd {
    padding: 16px 16px 8px;
  }
  .hd h1 {
    margin: 0 0 4px;
    font-size: 1.1rem;
    font-weight: 600;
  }
  .note {
    margin: 6px 0 0;
    font-size: 0.85rem;
    color: var(--muted);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
  }
  .stage {
    position: relative;
    flex: 1 1 auto;
    min-height: 260px;
    height: 46vh;
    max-height: 640px;
    margin: 0 16px;
    border-radius: 12px;
    overflow: hidden;
    background: var(--panel);
    border: 1px solid var(--border);
  }
  #bq-canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  .controls {
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 680px;
    width: 100%;
    margin: 0 auto;
  }
  .row {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .row.buttons {
    flex-direction: row;
    flex-wrap: wrap;
    gap: 10px;
  }
  button {
    font: inherit;
    font-size: 0.9rem;
    padding: 10px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  button#btn-skip {
    background: transparent;
    color: var(--fg);
  }
  label {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    color: var(--muted);
  }
  label output {
    color: var(--fg);
    font-variant-numeric: tabular-nums;
  }
  input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
  }
  .stats {
    flex-direction: row;
    flex-wrap: wrap;
    gap: 16px;
    font-size: 0.85rem;
    color: var(--muted);
    border-top: 1px solid var(--border);
    padding-top: 12px;
  }
  .stats b {
    color: var(--fg);
    font-variant-numeric: tabular-nums;
  }
  @media (min-width: 700px) {
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 24px;
    }
    .row.buttons, .stats { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
  <header class="hd">
    <h1>Bouquet Playground</h1>
    <p class="note" id="reduced-note" hidden>
      Reduced motion is on, so this shows the landed pose only. Fly-in
      controls are disabled.
    </p>
  </header>

  <div class="stage">
    <canvas id="bq-canvas" aria-label="Bouquet renderer preview"></canvas>
  </div>

  <section class="controls">
    <div class="row buttons">
      <button id="btn-replay" type="button">Replay fly-in</button>
      <button id="btn-skip" type="button" disabled>Skip</button>
    </div>

    <div class="row">
      <label for="sl-q">Reveal q <output id="out-q" for="sl-q">0.00</output></label>
      <input id="sl-q" type="range" min="0" max="1.2" step="0.01" value="0">
    </div>

    <div class="row">
      <label for="sl-yaw">Yaw <output id="out-yaw" for="sl-yaw">0&deg;</output></label>
      <input id="sl-yaw" type="range" min="-180" max="180" step="1" value="0">
    </div>

    <div class="row">
      <label for="sl-fly">Fly-in length <output id="out-fly" for="sl-fly">4200 ms</output></label>
      <input id="sl-fly" type="range" min="2000" max="6000" step="100" value="4200">
    </div>

    <div class="row stats" aria-live="polite">
      <span>Cubes drawn: <b id="stat-drawn">0</b></span>
      <span>Onscreen: <b id="stat-onscreen">0</b></span>
      <span>FPS: <b id="stat-fps">0</b></span>
    </div>
  </section>

<!--BOUQUET_DEMO_BUNDLE-->
</body>
</html>
