<!doctype html>
<html lang="en" data-mode="{{MODE}}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>A bouquet for you</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/styles/modes.css" />
  <link rel="stylesheet" href="/styles/base.css" />
  <link rel="stylesheet" href="/styles/gifts.css" />
  <link rel="stylesheet" href="/styles/bouquet.css" />
</head>
<body class="bq-body">
  <script type="application/json" id="bq-data">{{DATA_JSON}}</script>

  <main class="bq-page" id="bq-root">
    <h1 class="visually-hidden">A bouquet for you</h1>

    <section class="bq-gate" id="bq-gate" aria-labelledby="bq-gate-title" hidden>
      <p class="bq-gate__from" id="bq-gate-from"></p>
      <h2 class="bq-gate__title" id="bq-gate-title">A bouquet is waiting for you</h2>
      <div class="countdown" id="bq-countdown" hidden></div>
      <div id="bq-secret" hidden></div>
      <p class="bq-gate__status" id="bq-gate-status" role="status" aria-live="polite"></p>
    </section>

    <div class="bq-stage" data-reveal-stage id="bq-stage" hidden>
      <canvas class="bq-canvas" data-reveal-canvas aria-hidden="true"></canvas>

      <p class="bq-hint" aria-hidden="true">
        <span class="bq-hint--coarse">Hold to open</span>
        <span class="bq-hint--fine">Scroll to open</span>
      </p>

      <button type="button" class="btn btn-primary bq-open" data-reveal-open>
        Open
      </button>
    </div>

    <div
      class="bq-message note"
      id="bq-message"
      role="status"
      aria-live="polite"
      dir="auto"
      hidden
    >
      <p class="bq-message__text" id="bq-message-text"></p>
      <p class="note__from" id="bq-message-from" hidden></p>
    </div>

    <div class="gifts bq-gifts" id="bq-gifts"></div>

    <div class="bq-after" id="bq-after" hidden>
      <a class="btn btn-primary" id="bq-send-back" href="/">Send one back</a>
      <a class="bq-make-own" href="/">Make your own</a>
    </div>
  </main>

  <script type="module" src="/assets/bouquet.js"></script>
</body>
</html>
